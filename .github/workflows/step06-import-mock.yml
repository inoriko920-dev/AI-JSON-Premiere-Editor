name: STEP06 Premiere Media Import (Mocked Host Only)
on:
  push:
    branches:
      - 'sol/step06-*'
  pull_request:
    paths:
      - 'host/media_import_adapter.jsx'
      - 'tests/media_import_adapter.test.cjs'
      - 'core/import_snapshot.py'
      - 'tests/test_core_import_snapshot.py'
      - '.github/workflows/step06-import-mock.yml'
jobs:
  import:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run mocked Premiere media importer
        run: node --test tests/media_import_adapter.test.cjs
      - name: Run actual local media SHA and change-detection tests
        run: python -m unittest tests.test_core_import_snapshot -v
      - name: Run all JS panel, bridge and sequence adapter regression tests
        run: npm test
      - name: Run all Python JSON, media and tick regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Assert live CEP does not expose importer/mutations
        run: python -c "from pathlib import Path; s=Path('CSXS/manifest.xml').read_text(); assert '<ScriptPath>./host/step03.jsx</ScriptPath>' in s; assert 'media_import_adapter.jsx' not in s and 'sequence_adapter.jsx' not in s; print('NO_LIVE_HOST_MUTATION_ROUTE=PASS')"
