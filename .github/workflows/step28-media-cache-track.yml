name: STEP28 Media Snapshot to Track to Cache Cross-Stage Integrity (NO Host)
on:
  push:
    branches: ['sol/step19-*', 'sol/step28-*']
    paths:
      - 'core/fx_media_cache_track_preflight.py'
      - 'tests/test_core_fx_media_cache_track_preflight.py'
      - '.github/workflows/step28-media-cache-track.yml'
  pull_request:
    paths:
      - 'core/fx_media_cache_track_preflight.py'
      - 'tests/test_core_fx_media_cache_track_preflight.py'
      - '.github/workflows/step28-media-cache-track.yml'
jobs:
  cross-stage:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recheck source inventory, exact timeline instance and cached FX identity
        run: python -m unittest tests.test_core_fx_media_cache_track_preflight -v
      - name: Full Python security and regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Full CEP/ES3 JavaScript regression
        run: npm test
      - name: Assert immutable contract and unverified host boundary
        run: python -c "from core.fx_alpha_backend import backend_support; from pathlib import Path; b=backend_support(); assert b['coded_presets']==['FADE','WIPE'] and b['unimplemented_presets']==19 and b['actual_host_certified']==0; assert '<ScriptPath>./host/step03.jsx</ScriptPath>' in Path('CSXS/manifest.xml').read_text(); print('CROSS_STAGE_PREFLIGHT_ONLY_NO_HOST_ASSEMBLY')"
