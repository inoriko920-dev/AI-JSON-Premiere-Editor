name: STEP26 Cache Publish SHA Race and Inode Integrity (NO Host)
on:
  push:
    branches: ['sol/step19-*', 'sol/step26-*']
    paths:
      - 'core/fx_cache_worker.py'
      - 'tests/test_core_fx_cache_worker.py'
      - '.github/workflows/step26-cache-publication.yml'
  pull_request:
    paths:
      - 'core/fx_cache_worker.py'
      - 'tests/test_core_fx_cache_worker.py'
      - '.github/workflows/step26-cache-publication.yml'
jobs:
  publish-integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache race and post-publish integrity regression
        run: python -m unittest tests.test_core_fx_cache_worker -v
      - name: Full Python regression
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Full CEP and ES3 regression
        run: npm test
      - name: Keep frozen presets and Premiere host gate
        run: python -c "from core.fx_alpha_backend import backend_support; assert backend_support()['unimplemented_presets']==19 and backend_support()['actual_host_certified']==0; print('STEP26_CACHE_CODING_NOT_HOST_CERTIFICATION')"
