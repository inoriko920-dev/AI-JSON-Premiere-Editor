name: STEP23 Fade-to-Track Binding and Exact Clip End Guard (NO Premiere Host)
on:
  push:
    branches: ['sol/step19-*', 'sol/step23-*']
    paths:
      - 'core/fx_native_fade_binding.py'
      - 'host/native_opacity_inspector.jsx'
      - 'tests/test_core_fx_native_fade_binding.py'
      - 'tests/native_opacity_inspector.test.cjs'
      - '.github/workflows/step23-native-fade-binding.yml'
  pull_request:
    paths:
      - 'core/fx_native_fade_binding.py'
      - 'host/native_opacity_inspector.jsx'
      - 'tests/test_core_fx_native_fade_binding.py'
      - 'tests/native_opacity_inspector.test.cjs'
      - '.github/workflows/step23-native-fade-binding.yml'
jobs:
  binding:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cross-check Fade keyframe plan with exact four-track selector
        run: python -m unittest tests.test_core_fx_native_fade_binding -v
      - name: ES3 mock rejects clip end mismatch and setters
        run: node --test tests/native_opacity_inspector.test.cjs
      - name: Full Python regression
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Full CEP/ES3 regression
        run: npm test
      - name: Guard production panel and Adobe authorization
        run: python -c "from pathlib import Path; from core.fx_alpha_backend import backend_support; m=Path('CSXS/manifest.xml').read_text(); assert '<ScriptPath>./host/step03.jsx</ScriptPath>' in m; assert 'native_opacity_inspector.jsx' not in m; assert backend_support()['actual_host_certified']==0; print('STEP23_BINDING_NON_EXECUTABLE_AND_NOT_HOST_CERTIFIED')"
