name: STEP19 Fail-Closed Pixel-Verified MOV Cache (NO Premiere Host)
on:
  push:
    branches: ['sol/step19-*']
  pull_request:
    paths:
      - 'core/fx_cache_worker.py'
      - 'core/fx_alpha_verify.py'
      - 'tests/test_core_fx_alpha_verify.py'
      - 'tests/test_core_fx_cache_real_png.py'
      - 'tests/test_core_fx_cache_worker.py'
      - '.github/workflows/step19-cache-pixels.yml'
jobs:
  alpha-cache:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install FFmpeg only if unavailable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            $env:PATH = [Environment]::GetEnvironmentVariable('PATH','Machine') + ';' + [Environment]::GetEnvironmentVariable('PATH','User') + ';' + $env:PATH
          }
          ffmpeg -version
          ffprobe -version
      - name: Install FFmpeg only if unavailable (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Native binaries required, never use synthetic mock as alpha proof
        run: python -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe')"
      - name: Unit alpha sampling, mock cache fail-closed and legacy checks
        run: python -m unittest tests.test_core_fx_alpha_verify tests.test_core_fx_cache_worker -v
      - name: Real approved PNG read-only input to real temporary MOV
        run: python -m unittest tests.test_core_fx_cache_real_png -v
      - name: Full Python regression
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Full JavaScript/ES3 regression
        run: npm test
      - name: Keep Premiere host and user images unmodified
        run: python -c "from core.fx_alpha_backend import backend_support; from pathlib import Path; assert backend_support()['actual_host_certified']==0; assert backend_support()['unimplemented_presets']==19; assert '<ScriptPath>./host/step03.jsx</ScriptPath>' in Path('CSXS/manifest.xml').read_text(); print('CACHE_PIXEL_VERIFIED_DOES_NOT_CERTIFY_HOST_OR_VISUAL_FIDELITY')"
